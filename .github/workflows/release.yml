name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania, np. v0.4.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw wersję i adresy w module.json
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/new-tavern.zip" \
             '.version = $v | .manifest = $m | .download = $d' module.json > module.tmp
          mv module.tmp module.json
          cat module.json

      - name: Zbuduj archiwum
        run: zip -r new-tavern.zip module.json scripts styles templates lang fonts README.md

      - name: Utwórz wydanie lub dołącz do niego pliki
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            module.json
            new-tavern.zip
